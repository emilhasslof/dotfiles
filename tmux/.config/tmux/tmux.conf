set -g base-index 1
set -g pane-border-indicators off
set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#88C0D0"

set-option -g history-limit 25000
set -g mouse on

set -sg escape-time 1

# vi for copy mode
setw -g mode-keys vi

# Set the prefix to Ctrl-j
unbind C-b
set -g prefix C-j
bind C-j send-prefix

# Reload the file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# status bar
# Nord palette reference: bg #2E3440(0) #3B4252(1) #434C5E(2) #4C566A(3)
#            fg #D8DEE9(4) #E5E9F0(5) #ECEFF4(6)
#            accents: teal #8FBCBB  blue #88C0D0  blue2 #81A1C1  blue3 #5E81AC
#                      red #BF616A  orange #D08770  yellow #EBCB8B  green #A3BE8C  purple #B48EAD
set -g status-position top
set -g status-interval 3

# --- Style 1: minimal (current) - transparent bar, muted text -------------
#set -g status-style "fg=#4C566A"
#set -g status-bg default
#set -g status-left ""
#set -g status-right " %H:%M "

# --- Style 2: solid Nord bar with highlighted current window ---------------
set -g status-style "bg=#2E3440,fg=#D8DEE9"
set -g status-left "#[bg=#88C0D0,fg=#2E3440,bold]"
set -g status-right "#[fg=#4C566A]#[bg=#4C566A,fg=#ECEFF4] %H:%M "
setw -g window-status-current-style "bg=#3B4252,fg=#88C0D0,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Clipboard: pbcopy is a portable shim (~/.local/bin/pbcopy) that maps to
# wl-copy / xclip / native pbcopy depending on the platform.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key b "break-pane"
bind c "new-window -c '#{pane_current_path}'"
bind '"' " split-window -v -c '#{pane_current_path}'"
bind % " split-window -h -c '#{pane_current_path}'"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
